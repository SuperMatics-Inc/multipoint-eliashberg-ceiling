name: replay-and-paper
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          build: false
      - name: Install Tectonic and poppler
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          tectonic --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Pinned source manifest
        run: sha256sum -c MANIFEST.sha256
      - name: Complete README replay, fourteen mutants, finite Lean and manuscript
        run: |
          set -euo pipefail
          awk '/^```sh$/{inside=1; next} /^```$/{if(inside) exit} inside {print}' README.md > /tmp/optimum-readme.sh
          test -s /tmp/optimum-readme.sh
          sh /tmp/optimum-readme.sh
          rm /tmp/optimum-readme.sh
          if grep -nE 'Overfull \\[hv]box|Citation .*undefined|Reference .*undefined|There were undefined references|Label\(s\) may have changed|Missing character' paper/main.log; then exit 1; fi
          if grep -nE '—|---' paper/main.tex paper/refs.bib; then exit 1; fi
          if grep -n '—' README.md CITATION.cff; then exit 1; fi
          test -s paper/main.pdf
          pdfinfo paper/main.pdf | tee /tmp/optimum-pdfinfo.txt
          grep -Eq '^Pages: +7$' /tmp/optimum-pdfinfo.txt
          pdfinfo -url paper/main.pdf > /tmp/optimum-links.txt
          cat /tmp/optimum-links.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24374032' /tmp/optimum-links.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24374034' /tmp/optimum-links.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24372930' /tmp/optimum-links.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24364879' /tmp/optimum-links.txt
          grep -qF 'https://doi.org/10.1103/PhysRevB.77.214526' /tmp/optimum-links.txt
          pdftotext paper/main.pdf - | grep -q 'Dolgov and Golubov'
          grep -qF 'https://github.com/SuperMatics-Inc/multipoint-eliashberg-ceiling' /tmp/optimum-links.txt
      - uses: actions/upload-artifact@v4
        with:
          name: multipoint-eliashberg-ceiling-paper
          path: |
            paper/main.pdf
            paper/main.log
          if-no-files-found: error
